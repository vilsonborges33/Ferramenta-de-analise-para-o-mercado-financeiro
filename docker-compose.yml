services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analise}
      POSTGRES_DB: ${POSTGRES_DB:-analise}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analise}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    image: analise-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-analise}:${POSTGRES_PASSWORD:-analise}@db:5432/${POSTGRES_DB:-analise}
      DIRETORIO_DADOS_BRUTOS: /dados_brutos
    volumes:
      - ./dados_brutos:/dados_brutos
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    image: analise-backend  # mesma imagem do backend, outro processo
    command: ["python", "-m", "app.jobs.agendador"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-analise}:${POSTGRES_PASSWORD:-analise}@db:5432/${POSTGRES_DB:-analise}
      DIRETORIO_DADOS_BRUTOS: /dados_brutos
    volumes:
      - ./dados_brutos:/dados_brutos
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    image: analise-frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  dados_postgres:
